  """model"""
  model: String!

  """code"""
  code: String!

  """Industrial Unique ID"""
  uid: String!

  """battery level of the vehicle in percentage"""
  battery: Float!

  """status of the vehicle"""
  status: VehicleStatusEnum! = AVAILABLE

  """Coordinates, [longitude, latitude]"""
  location: [Float!]!

  """
  distance in Kilometers the vehicle can travel with current battery level
  """
