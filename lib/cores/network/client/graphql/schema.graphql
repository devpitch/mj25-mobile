}

"""Input for creating a user verification"""
input CreateVerificationInput {
  """User Id Type"""
  idType: String! = "NIN"

  """User Id number"""
  idNumber: String!

  """User date of birth"""
  birthDate: String
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

"""Specifies the default payment method for a user"""
enum DefaultPaymentMethodEnum {
  """Payment method for subscription customer"""
  SUBSCRIPTION

  """Payment method for one-time pass purchase"""
  PASS

  """Payment method for continuous Pay-As-You-Go (PAYG) customer"""
  WALLET
}

"""Applied Discount response data"""
type DiscountCostDetail {
  """Original amount of transaction"""
  amount: Float!

  """
  Saved amount of transaction - difference from original amount and amount subtracted
  """
  saved: Float!

  """Final amount of transaction after applying discount"""
  final: Float!
}

"""Specifies the coverage of the discount"""
enum DiscountCoverageEnum {
  """Full coverage - Discount applies to the entire service"""
  FULL

  """Time coverage - Discount applies to time-based services"""
  TIME

  """Unlock coverage - Discount applies to unlock features"""
  UNLOCK

  """Pass coverage - Discount applies to pass purchases"""
  PASS

  """Subscription coverage - Discount applies to subscription payment"""
  SUBSCRIPTION
}

type DiscountResponse {
  """Unique Identifier"""
  _id: ID!

  """Unique discount code"""
  code: String!

  """User ID for user-specific discounts"""
  userId: String

  """Type of discount, either USER or GENERAL"""
  type: DiscountTypeEnum!

  """Expiration date of the discount"""
  activeUntil: DateTime!

  """
  Coverage type of the discount, e.g., Unlock or Rental Time cost or both
  """
  coverage: DiscountCoverageEnum!

  """Maximum amount or reduction provided by the discount """
  cappedAmount: Float

  """Percentage of the discount applied to the original cost"""
  percentage: Float!

  """Maximum number of times the discount can be redeemed"""
  maxRedemption: Float!

  """Total number of times the discount has been redeemed"""
  totalRedemption: Float!

  """Current status of the discount"""
  status: DiscountStatusEnum!

  """Creation date of the discount"""
  createdAt: DateTime!

  """Last updated date of the discount"""
  updatedAt: DateTime!
}

"""Specifies the status of the discount"""
enum DiscountStatusEnum {
  """Active discount - Currently available for use"""
  ACTIVE

  """Inactive discount - Temporarily disabled"""
  INACTIVE

  """Used discount - Has reached maximum redemption limit"""
  USED

  """Archived discount - No longer in use but kept"""
  ARCHIVED

  """Expired discount - Past its active date and no longer valid"""
  EXPIRED
}

"""Specifies the type of discount offered"""
enum DiscountTypeEnum {
  """Discount applicable to a specific user"""
  USER

  """General discount applicable to all users"""
  GENERAL
}

type Faq {
  """Unique Identifier"""
