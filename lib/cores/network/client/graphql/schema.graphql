  updatedAt: DateTime!
}

"""The various statuses a fault can have"""
enum FaultStatusEnum {
  """The fault is open and has not been addressed yet."""
  OPEN

  """The fault is currently being worked on."""
  IN_PROGRESS

  """The fault has been resolved but not yet closed."""
  RESOLVED

  """The fault has been closed and no further action is needed."""
  CLOSED
}

"""The type of fault that can occur on a bike"""
enum FaultTypeEnum {
  """Issues related to the bike brake system"""
  BRAKE

  """Issues related to the bike saddle (seat)"""
  SADDLE

  """Issues related to the bike bell"""
  BELL

  """Any other type of fault not covered by the above categories"""
  OTHER

  """Issues related to the bike tyre"""
  TYRE

  """Issues related to the bike lock"""
  LOCK

  """Issues related to the bike chain"""
  POWERTRAIN

  """Issues related to the bike light"""
  LIGHT
}

