}

"""Input type for creating a payment option"""
input CreatePaymentOptionInput {
  """Name of the payment option"""
  title: String!

  """Type of the payment option"""
  type: PaymentOptionTypeEnum!

  """Description of the payment option"""
  description: String!

  """Features of the payment option"""
  features: [String!]!

  """If the payment option is a recommended option"""
  isRecommended: Boolean!

  """Availability status of Payment option"""
  status: PaymentOptionStatusEnum!

  """Period duration of a single Payment option item"""
  period: Float!

  """Period unit of duration of a single Payment option item"""
  periodUnit: PeriodUnitTypeEnum!

  """Ride duration available for a single Payment option item"""
  rideDuration: Float!

  """Additional message displayed on Payment option purchase"""
  messageText: String

  """Start date for a Payment option"""
  startAt: String = null

  """Price details for the payment option"""
  price: CreatePaymentOptionPrice!
}

"""Input type for creating a payment option"""
input CreatePaymentOptionPrice {
  """Regular amount without discount"""
  regular: Float!

  """Amount saved in descriptive text"""
  saving: String

  """Final retails cost after discount has been applied"""
