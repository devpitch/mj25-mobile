type Mutation {
  """Onboard a returning or new user"""
  start(input: StartInput!): StartResponse!

  """Activate a user account"""
  activate(input: ActivateInput!): LoginResponse!

  """Login a returning user"""
  login(input: LoginInput!): LoginResponse!

  """Refresh user access and refresh tokens"""
  refreshToken: LoginResponse!

  """Set system wallet configuration"""
  setWalletConfig(input: SetWalletConfigInput!): WalletConfigResponse!

  """Create a new transaction"""
  createTransaction(input: CreateTransactionInput!): TransactionResponse!

  """Verify a transaction"""
  verifyTransaction(input: SimpleInput!): TransactionResponse!

  """Update payment cards for a user"""
  updatePaymentCard(input: UpdatePaymentCardInput!): PaymentCardResponse!

  """Create a new payment option"""
  createPaymentOption(input: CreatePaymentOptionInput!): PaymentOptionResponse!

  """Update an existing payment option"""
  updatePaymentOption(input: UpdatePaymentOptionInput!): PaymentOptionResponse!

  """Complete Subscription Enrolment"""
  enrolSubscription(input: CreateSubscriptionInput!): SubscriptionResponse!

  """Cancel/Reactivate, Pause/Resume Subscription"""
  manageSubscription(input: UpdateSubscriptionInput!): SubscriptionResponse!

  """Create Subscription Cancellation/Pause Reason"""
  createSubscriptionActionReason(input: CreateSubscriptionReasonsInput!): SubscriptionReasonsResponse!

  """Update Subscription Cancellation/Pause Reason"""
  updateSubscriptionActionReason(input: UpdateSubscriptionReasonsInput!): SubscriptionReasonsResponse!

  """Verify a bank account"""
  verifyBankingDetail(input: BankingVerificationInput!): BankingVerificationResponse!

  """Create a new discount"""
  createDiscount(input: CreateDiscountInput!): DiscountResponse!

  """Apply a discount to a transaction"""
  applyDiscount(input: ApplyDiscountInput!): DiscountResponse!

  """Create a new vehicle in the fleet"""
  createVehicle(input: CreateVehicleInput!): VehicleResponse!

  """Update an existing vehicle"""
  updateVehicle(input: UpdateVehicleInput!): VehicleResponse!

  """Create/Update a new GeoLocation"""
  setGeoLocation(input: CreateGeoLocationInput!): GeoLocationResponse!

  """Create a new fault item"""
  createFault(input: CreateFaultInput!): FaultResponse!

  """Report one ore more faults for a vehicle"""
  reportFault(input: CreateFaultReportInput!): FaultReportResponse!

  """
  Assigns a fault to others or to the staff member who is currently logged in
  """
  assignFaultReport(input: AssignFaultReportInput!): FaultReportResponse!

  """Marks a fault report as invalid and removes it"""
  removeFaultItem(input: RemoveFaultReportItemInput!): FaultReportResponse!

  """initiates the ride"""
  initiateRental(input: InitiateRentalInput!): RentalResponse!

  """Ends the rental after the ride"""
  endRental(input: SimpleInput!): RentalResponse!

  """initiates a group rental operation for a user"""
  initiateGroupRental(input: InitiateGroupRentalInput!): GroupRentalResponse!

  """Join a group rental"""
  joinGroupRental(input: JoinGroupRentalInput!): GroupRentalResponse!

  """Subscribe an email to the RydMie mailing list"""
  subscribeNewsLetter(input: MailingListInput!): OkayResponse!

  """Unsubscribe an email from the RydMie mailing list"""
  unsubscribeNewsLetter(input: UnsubscribeMailingListInput!): OkayResponse!

  """Update user information"""
  updateUser(input: UpdateUserInput!): UserResponse!

  """Create record and process user verification"""
  verifyMe(input: CreateVerificationInput!): VerificationResponse!

  """Create a new user support ticket"""
  createUserSupport(input: CreateUserSupportTicketInput!): UserSupportTicketResponse!

  """Update an existing user support ticket"""
  updateUserSupport(input: UpdateUserSupportTicketInput!): UserSupportTicketResponse!

  """create an FAQ"""
  createFaq(input: CreateFaqInput!): Faq!

  """Update FAQ"""
  updateFaq(input: UpdateFaqInput!): Faq!

  """Delete FAQ"""
  deleteFaq(input: SimpleInput!): Boolean!
}

