}

"""Input type for creating a discount"""
input CreateDiscountInput {
  """Unique discount code"""
  code: String!

  """User ID for user-specific discounts"""
  userId: String

  """Type of discount, either USER or GENERAL"""
  type: DiscountTypeEnum!

  """Expiration date of the discount"""
  activeUntil: DateTime!

  """
  Coverage type of the discount, e.g., Unlock or Rental Time cost or both
  """
  coverage: DiscountCoverageEnum!

  """Maximum amount or reduction provided by the discount """
  cappedAmount: Float

  """Percentage of the discount applied to the original cost"""
  percentage: Float!

  """Maximum number of times the discount can be redeemed"""
  maxRedemption: Float! = 1
}

input CreateFaqInput {
  question: String!
  answer: String!
}

"""Input type for creating a fault item"""
input CreateFaultInput {
