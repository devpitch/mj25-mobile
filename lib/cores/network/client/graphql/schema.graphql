"""
Indicates exactly one field must be supplied and this field must not be `null`.
"""
directive @oneOf on INPUT_OBJECT

input ActivateInput {
  """User phone number"""
  phone: String!

  """Activation code sent to user"""
  code: String!

  """Referral code with which the user was invited"""
  referralCode: String
}

union ActivityLogUnionType = ServiceEventLog | AdminActivityLog | UserActivityLog

type AdminActivityLog {
  """Unique Identifier"""
  _id: ID!

  """Action name"""
  action: String!

  """Service name"""
  service: String!

  """Unique user Identifier"""
  userId: ID

  """Event timestamp"""
  timestamp: DateTime!

  """Record creation time"""
  createdAt: DateTime!
}

"""Applied Discount response data"""
type AppliedDiscount {
  """Discount ID"""
  _id: ID!

  """Type of discount"""
  type: DiscountTypeEnum!

  """Type of costs the discount covers"""
  coverage: DiscountCoverageEnum!

  """Percentage the discount covers"""
  percent: Float!

  """Time based discount details"""
  price: DiscountCostDetail

  """Price based discount details"""
  time: DiscountCostDetail
}

"""Input type for applying a discount"""
input ApplyDiscountInput {
  """Discount code to apply"""
  code: String!

  """Transaction ID for the discount application"""
  transactionId: ID!

  """Type of transaction"""
